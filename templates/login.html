<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harven AI · 远程登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a; color: #e2e8f0;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 20px;
        }
        .login-box {
            background: #1e293b; border-radius: 12px; padding: 40px;
            max-width: 400px; width: 100%; text-align: center;
            border: 1px solid #334155;
        }
        .logo { font-size: 40px; margin-bottom: 12px; }
        h1 { font-size: 22px; margin-bottom: 6px; }
        .sub { color: #94a3b8; font-size: 13px; margin-bottom: 24px; }
        input {
            width: 100%; padding: 12px; border-radius: 8px;
            border: 1px solid #475569; background: #0f172a; color: #e2e8f0;
            font-size: 16px; margin-bottom: 16px; outline: none;
        }
        input:focus { border-color: #22c55e; }
        button {
            width: 100%; padding: 12px; border-radius: 8px;
            background: #22c55e; color: #fff; border: none;
            font-size: 16px; cursor: pointer; font-weight: 600;
        }
        button:hover { background: #16a34a; }
        .error { color: #ef4444; font-size: 13px; margin-top: 12px; display: none; }
        .hint { color: #94a3b8; font-size: 12px; margin-top: 16px; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">🏠</div>
        <h1>Harven AI</h1>
        <p class="sub">远程访问需要密码<br>就是你登录电脑哈文时用的那个密码<br><b style="color:#cbd5e1">默认 harven2026（改过就用改过的）</b><br><span style="font-size:12px">想改密码？电脑端 设置→安全隐私</span></p>
        <form id="loginForm" onsubmit="return doLogin(event)">
            <input type="password" id="password" placeholder="输入远程密码" autofocus>
            <button type="submit">登录</button>
            <div class="error" id="error"></div>
        </form>
        <p class="hint">⚡ 桌面端本机访问无需密码</p>
    </div>
    <script>
    async function doLogin(e) {
        e.preventDefault();
        var pwd = document.getElementById('password').value;
        var err = document.getElementById('error');
        if (!pwd) { err.style.display = 'block'; err.textContent = '请输入密码'; return false; }
        try {
            var r = await fetch('/api/auth/remote-login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({password: pwd})
            });
            var d = await r.json();
            if (d.success) {
                var next = new URLSearchParams(location.search).get('next') || '/';
                // ★ 2026-10-10 APP WebView 缓存修复：跳转加时间戳参数，绕开被缓存的 302 重定向
                // （症状：APP 内输对密码后"输入框清空无反应"，就是命中了未登录时的缓存 302 又弹回登录页）
                location.href = next + (next.indexOf('?') >= 0 ? '&' : '?') + '_=' + Date.now();
            } else {
                err.style.display = 'block';
                err.textContent = '❌ ' + (d.error || '密码错误');
            }
        } catch(ex) {
            err.style.display = 'block';
            err.textContent = '❌ 网络错误，请确认桌面端正在运行';
        }
        return false;
    }
    </script>
</body>
</html>
