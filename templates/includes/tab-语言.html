<!-- Tab: 语言（已合并到基本信息，隐藏面板保留元素供 saveAllSettings 读取） -->
                <div class="tab-panel" id="tab-language" style="display:none">
                    <div class="settings-grid">
                        <!-- ★ 2026-08-16: 主语言（AI 对话语言）— 保留 DOM 兼容，但隐藏，由下方"界面语言"统一控制 -->
                        <div class="setting-group" style="display:none">
                            <label>主语言</label>
                            <select id="setLangMain">
                                <option value="zh-CN" selected>中文（简体）</option>
                                <option value="en">English</option>
                            </select>
                        </div>
                        <div class="setting-group" style="display:none">
                            <label>其他语言处理方式</label>
                            <select id="setLangMode">
                                <option value="translate" selected>自动翻译为主语言</option>
                                <option value="keep">保持原文回答</option>
                                <option value="bilingual">双语显示（原文 + 翻译）</option>
                            </select>
                        </div>
                        <div class="setting-group">
                            <!-- ★ 2026-08-16: 界面语言 — 统一控制界面显示语言 + AI 回答语言（不再分两个下拉） -->
                            <label data-i18n="web.lang_setting_label">界面与回答语言</label>
                            <select id="setUiLang" onchange="if(window.HarvenI18n&&this.value!=='follow')HarvenI18n.setLang(this.value)">
                                <option value="follow" selected data-i18n="web.lang_follow">跟随系统语言</option>
                                <option value="zh_CN">简体中文</option>
                                <option value="en_US">English</option>
                            </select>
                            <div class="setting-desc" data-i18n="web.lang_setting_desc">切换哈文界面显示语言和 AI 回答语言（当前支持 中文 / English）</div>
                        </div>
                    </div>
                </div>
