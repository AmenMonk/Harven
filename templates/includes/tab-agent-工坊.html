<!-- Tab: Agent 工坊 — 随时创造 Agent -->
                <div class="tab-panel" id="tab-agent-workshop">
                    <div class="settings-grid">
                        <div class="setting-section-title" data-i18n="web.agentworkshop.title_1">🏭 Agent 工坊</div>
                        <div style="background:linear-gradient(135deg,#1a1a3e,#2d2d5e);border-radius:12px;padding:16px;margin-bottom:16px;border:1px solid #667eea;">
                            <div style="font-weight:600;color:#a78bfa;margin-bottom:8px;">💡 一句话创造一个 Agent</div>
                            <div style="font-size:12px;color:#94a3b8;line-height:1.6;">
                                告诉哈文你想要什么样的 Agent，自动生成专属 system_prompt 并注册。
                            </div>
                        </div>

                        <div class="setting-group">
                            <label data-i18n="web.agentworkshop.label_1">Agent 名称</label>
                            <input type="text" id="agentName" data-i18n-ph="web.agentworkshop.placeholder_1" placeholder="例如：文案大师、数据分析师、法律顾问" style="width:100%;box-sizing:border-box;">
                            <div class="setting-desc" data-i18n="web.agentworkshop.desc_1">给 Agent 起个名字，要简短</div>
                        </div>

                        <div class="setting-group">
                            <label data-i18n="web.agentworkshop.label_2">Agent 角色描述</label>
                            <textarea id="agentRole" rows="3" placeholder="例如：一个专业的法律文书撰写助手，擅长合同审查、法律意见书，语言严谨规范" style="width:100%;box-sizing:border-box;background:#1e1e2e;color:#e0e0f0;border:1px solid var(--border);border-radius:8px;padding:12px;font-size:14px;"></textarea>
                            <div class="setting-desc" data-i18n="web.agentworkshop.desc_2">描述这个 Agent 是干什么的、有什么特长</div>
                        </div>

                        <div class="setting-group">
                            <label data-i18n="web.agentworkshop.label_3">触发词（逗号分隔）</label>
                            <input type="text" id="agentTriggers" data-i18n-ph="web.agentworkshop.placeholder_2" placeholder="例如：审查合同,起草律师函,法律意见" style="width:100%;box-sizing:border-box;">
                            <div class="setting-desc" data-i18n="web.agentworkshop.desc_3">用户说这些词时自动路由到此 Agent</div>
                        </div>

                        <div class="setting-group">
                            <label data-i18n="web.agentworkshop.label_4">模型偏好</label>
                            <select id="agentModelPref" style="width:100%;box-sizing:border-box;">
                                <option value="local" data-i18n="web.agentworkshop.option_1">🏠 本地引擎</option>
                                <option value="external" data-i18n="web.agentworkshop.option_2">🤖 外脑 API</option>
                                <option value="collab" data-i18n="web.agentworkshop.option_3">🤝 协作模式</option>
                            </select>
                        </div>

                        <div style="display:flex;gap:10px;margin-top:16px;">
                            <button class="btn-primary" onclick="generateAgentPrompt()" style="flex:1;padding:12px;" data-i18n="web.agentworkshop.button_1">
                                🤖 AI 自动生成 system_prompt
                            </button>
                            <button class="btn-primary" onclick="registerAgent()" style="flex:1;padding:12px;background:linear-gradient(135deg,#22c55e,#16a34a);" data-i18n="web.agentworkshop.button_2">
                                ✅ 注册 Agent
                            </button>
                        </div>

                        <!-- 生成的 system_prompt 预览 -->
                        <div class="setting-group" id="promptPreview" style="display:none;margin-top:16px;">
                            <label data-i18n="web.agentworkshop.label_5">生成的 system_prompt（可编辑）</label>
                            <textarea id="agentPrompt" rows="8" style="width:100%;box-sizing:border-box;background:#1e1e2e;color:#cdd6f4;border:1px solid #22c55e;border-radius:8px;padding:12px;font-family:monospace;font-size:13px;"></textarea>
                        </div>

                        <!-- 已创建的 Agent 列表 -->
                        <div class="setting-section-title" style="margin-top:24px;" data-i18n="web.agentworkshop.title_2">📋 我的 Agent</div>
                        <div id="customAgentList" style="display:flex;flex-direction:column;gap:8px;">
                            <span style="color:#888;font-size:12px;" data-i18n="web.agentworkshop.span_1">⏳ 加载中...</span>
                        </div>
                    </div>
                </div>

<script>
// ═══ Agent 工坊 JS ═══

// 加载自定义 Agent 列表
async function loadCustomAgents() {
    var container = document.getElementById('customAgentList');
    try {
        var r = await fetch('/api/agents');
        var data = await r.json();
        var agents = data.agents || [];
        var custom = agents.filter(function(a) { return a.custom; });
        if (custom.length === 0) {
            container.innerHTML = '<span style="color:#888;font-size:12px;" data-i18n="web.agentworkshop.span_2">还没有自定义 Agent，用上面的表单创建一个吧</span>';
            return;
        }
        container.innerHTML = custom.map(function(a) {
            return '<div style="background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:12px;">' +
                '<div style="display:flex;justify-content:space-between;align-items:center;">' +
                '<span style="font-weight:600;">🤖 ' + a.name + '</span>' +
                '<span style="font-size:11px;color:#888;">' + (a.model_pref||'local') + '</span>' +
                '</div>' +
                '<div style="font-size:12px;color:var(--text-secondary);margin-top:4px;">' + (a.role||'') + '</div>' +
                '<div style="font-size:11px;color:#666;margin-top:4px;">触发: ' + (a.triggers||[]).join('、') + '</div>' +
                '<button onclick="deleteAgent(\''+a.id+'\')" style="margin-top:6px;padding:2px 10px;background:#e53e3e;color:#fff;border:none;border-radius:4px;font-size:11px;cursor:pointer;" data-i18n="web.agentworkshop.button_3">🗑 删除</button>' +
                '</div>';
        }).join('');
    } catch(e) {
        container.innerHTML = '<span style="color:#f87171;" data-i18n="web.agentworkshop.span_3">加载失败</span>';
    }
}

// AI 自动生成 system_prompt
async function generateAgentPrompt() {
    var name = document.getElementById('agentName').value.trim();
    var role = document.getElementById('agentRole').value.trim();
    if (!name || !role) {
        alert('请先填写 Agent 名称和角色描述');
        return;
    }

    document.getElementById('agentPrompt').value = '⏳ AI 正在生成 system_prompt...';
    document.getElementById('promptPreview').style.display = 'block';

    // 本地生成模板（本地引擎可用时调 AI，否则用模板）
    var prompt = '你是哈文AI的专项子Agent——' + name + '。\n\n' +
        '## 你的角色\n' + role + '\n\n' +
        '## 规则\n' +
        '1. 只做你擅长的事，不越界\n' +
        '2. 输出：先结论，后详情\n' +
        '3. 遇到不属于你领域的请求，回复："[SKIP] 请交给其他Agent处理"\n\n' +
        '## 能力边界\n' + role + '，仅此而已。';

    document.getElementById('agentPrompt').value = prompt;
}

// 注册 Agent
async function registerAgent() {
    var name = document.getElementById('agentName').value.trim();
    var role = document.getElementById('agentRole').value.trim();
    var prompt = document.getElementById('agentPrompt').value.trim();
    var triggers = document.getElementById('agentTriggers').value.trim();
    var modelPref = document.getElementById('agentModelPref').value;

    if (!name || !role || !prompt) {
        alert('请填写名称、角色描述和 system_prompt');
        return;
    }

    // 生成 ID
    var id = 'custom_' + name.replace(/[^a-zA-Z0-9\u4e00-\u9fff]/g, '_').toLowerCase();
    var triggerList = triggers ? triggers.split(/[,，]+/).map(function(t){return t.trim()}).filter(Boolean) : [];

    try {
        var r = await fetch('/api/agents/register', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                id: id,
                name: name,
                role: role,
                system_prompt: prompt,
                model_pref: modelPref,
                skills: [],
                triggers: triggerList
            })
        });
        var data = await r.json();
        if (data.success) {
            alert('✅ Agent \"' + name + '\" 创建成功！');
            loadCustomAgents();
        } else {
            alert('❌ 创建失败: ' + (data.error || '未知错误'));
        }
    } catch(e) {
        alert('❌ 网络错误: ' + e.message);
    }
}

// 删除 Agent
async function deleteAgent(id) {
    if (!confirm('确认删除这个 Agent？')) return;
    try {
        var r = await fetch('/api/agents/' + id, { method: 'DELETE' });
        var data = await r.json();
        if (data.success) {
            loadCustomAgents();
        } else {
            alert('删除失败: ' + (data.error || ''));
        }
    } catch(e) {
        alert('网络错误: ' + e.message);
    }
}

// 全局暴露
window.generateAgentPrompt = generateAgentPrompt;
window.registerAgent = registerAgent;
window.deleteAgent = deleteAgent;
window.loadCustomAgents = loadCustomAgents;

// 加载时自动获取列表
setTimeout(loadCustomAgents, 500);
</script>
