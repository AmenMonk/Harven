<script>
    // ===== Service Worker 完全禁用 =====
    // 历史原因：旧 SW 缓存导致 JS 文件无法更新，已彻底移除
    // 如果浏览器残留旧 SW，在此清理
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
            registrations.forEach(function(reg) {
                reg.unregister();
            });
        });
        if ('caches' in window) {
            caches.keys().then(function(keys) {
                keys.forEach(function(key) { caches.delete(key); });
            });
        }
    }

    // PWA 安装提示（保留，不影响功能）
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        if (!localStorage.getItem('pwa_install_dismissed')) {
            setTimeout(function() { showPWAInstallBanner(); }, 3000);
        }
    });
    function showPWAInstallBanner() {
        if (!deferredPrompt) return;
        var banner = document.createElement('div');
        banner.id = 'pwa-banner';
        banner.innerHTML = '<div style="display:flex;align-items:center;gap:10px;"><img src="/static/icons/duck_64.png" width="32" height="32" style="border-radius:6px;"><div style="flex:1;"><b>添加到主屏幕</b><br><span style="font-size:12px;opacity:.8;">随时快速访问 Harven AI</span></div><button onclick="installPWA()" style="background:#4a9eff;color:#fff;border:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;">安装</button><button onclick="dismissPWABanner()" style="background:transparent;color:#fff;border:none;font-size:18px;cursor:pointer;opacity:.7;">✕</button></div>';
        banner.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.4);z-index:9999;min-width:300px;max-width:420px;';
        document.body.appendChild(banner);
    }
    function installPWA() {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then(function(r) {
                console.log('[PWA] 安装结果:', r.outcome);
                deferredPrompt = null;
            });
        }
        dismissPWABanner();
    }
    function dismissPWABanner() {
        var b = document.getElementById('pwa-banner');
        if (b) b.remove();
        localStorage.setItem('pwa_install_dismissed', '1');
    }
</script>
