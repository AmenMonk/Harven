<!-- 数据保险箱：审计日志 + 备份导出 -->
                <div class="tab-panel" id="tab-vault">
                    <div class="setting-section-title">📋 操作日志</div>
                    <div class="setting-group">
                        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
                            <span class="setting-desc">系统的命令执行记录和设备操作日志</span>
                            <button class="btn-secondary btn-sm" id="vaultRefreshBtn" onclick="HarvenVault.loadLogs()">🔄 刷新</button>
                        </div>
                        <div id="vaultLogTable" style="font-size:13px;color:var(--text-secondary);">
                            点击刷新加载...
                        </div>
                    </div>

                    <div class="setting-section-title" style="margin-top:20px;">💾 数据备份</div>
                    <div class="setting-group">
                        <div class="setting-desc" style="margin-bottom:10px;">打包 data/ 目录（对话记录、知识库索引、配置）下载到本地</div>
                        <button class="btn-primary btn-sm" id="vaultBackupBtn" onclick="HarvenVault.backup()" style="background:#22c55e;border-color:#22c55e;">
                            📦 导出备份包
                        </button>
                        <span id="vaultBackupStatus" style="margin-left:10px;font-size:12px;color:#94a3b8;"></span>
                    </div>
                </div>

<script>
window.HarvenVault = {
    loadLogs: async function() {
        var el = document.getElementById('vaultLogTable');
        el.innerHTML = '⏳ 加载中...';
        try {
            var r = await fetch('/api/devices/log');
            var data = await r.json();
            var logs = data.logs || data || [];
            if (!logs.length) { el.innerHTML = '<span style="color:#94a3b8;">暂无操作记录</span>'; return; }
            el.innerHTML = '<table style="width:100%;border-collapse:collapse;font-size:12px;">' +
                '<tr style="color:#94a3b8;border-bottom:1px solid #334155;">' +
                '<th style="text-align:left;padding:4px;">时间</th>' +
                '<th style="text-align:left;padding:4px;">设备</th>' +
                '<th style="text-align:left;padding:4px;">命令</th>' +
                '<th style="text-align:left;padding:4px;">结果</th></tr>' +
                logs.slice(-50).reverse().map(function(l) {
                    return '<tr style="border-bottom:1px solid #1e293b;">' +
                        '<td style="padding:4px;">' + (l.timestamp || l.time || '').substring(11,19) + '</td>' +
                        '<td style="padding:4px;">' + (l.device_id || '') + '</td>' +
                        '<td style="padding:4px;">' + (l.command || '') + '</td>' +
                        '<td style="padding:4px;color:' + (l.success ? '#22c55e' : '#ef4444') + ';">' + (l.success ? '✅' : '❌') + '</td></tr>';
                }).join('') + '</table>';
        } catch(e) { el.innerHTML = '❌ 加载失败: ' + e.message; }
    },

    backup: async function() {
        var btn = document.getElementById('vaultBackupBtn');
        var st = document.getElementById('vaultBackupStatus');
        btn.disabled = true; btn.textContent = '⏳ 打包中...';
        st.textContent = '';
        try {
            var r = await fetch('/api/vault/backup', { method: 'POST' });
            var data = await r.json();
            if (data.success && data.url) {
                st.innerHTML = '✅ <a href="' + data.url + '" style="color:#22c55e;">下载备份 (' + (data.size_mb || '?') + 'MB)</a>';
            } else {
                st.textContent = '❌ ' + (data.error || '备份失败');
                st.style.color = '#ef4444';
            }
        } catch(e) { st.textContent = '❌ ' + e.message; st.style.color = '#ef4444'; }
        btn.disabled = false; btn.textContent = '📦 导出备份包';
    }
};
</script>
