<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#10203a"/>
      <stop offset="1" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#ef6820"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#glow)"/>

  <!-- decorative node graph, right side -->
  <g stroke="#3b82f6" stroke-opacity="0.45" stroke-width="1.5" fill="none">
    <line x1="900" y1="80"  x2="1010" y2="130"/>
    <line x1="1010" y1="130" x2="950" y2="210"/>
    <line x1="1010" y1="130" x2="1110" y2="90"/>
    <line x1="950" y1="210" x2="1080" y2="230"/>
    <line x1="1010" y1="130" x2="1080" y2="230"/>
    <line x1="900" y1="80" x2="1110" y2="90"/>
  </g>
  <g>
    <circle cx="900"  cy="80"  r="7" fill="#f59e0b"/>
    <circle cx="1010" cy="130" r="10" fill="#3b82f6"/>
    <circle cx="950"  cy="210" r="6" fill="#10b981"/>
    <circle cx="1110" cy="90"  r="6" fill="#ef4444"/>
    <circle cx="1080" cy="230" r="7" fill="#a855f7"/>
  </g>

  <!-- title -->
  <text x="64" y="120" font-size="64" font-weight="700" fill="#ffffff">Harven AI</text>
  <rect x="66" y="140" width="240" height="6" rx="3" fill="url(#accent)"/>
  <text x="64" y="185" font-size="26" fill="#9fb3c8">Local-first Family AI Hub</text>
  <text x="64" y="222" font-size="22" fill="#c9d6e3">家庭 AI 中台 · 数据永不出门 · 管家零 token · 29 个垂直面板</text>

  <!-- chips -->
  <g font-size="15">
    <rect x="64"  y="244" width="118" height="30" rx="15" fill="#1f6feb" fill-opacity="0.18" stroke="#1f6feb"/>
    <text x="76"  y="264" fill="#79b8ff">100% Local</text>
    <rect x="194" y="244" width="126" height="30" rx="15" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b"/>
    <text x="206" y="264" fill="#fbd66f">Offline Ready</text>
    <rect x="332" y="244" width="128" height="30" rx="15" fill="#10b981" fill-opacity="0.15" stroke="#10b981"/>
    <text x="344" y="264" fill="#56d364">Self-Hostable</text>
    <rect x="472" y="244" width="134" height="30" rx="15" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7"/>
    <text x="484" y="264" fill="#d2a8ff">Apache 2.0</text>
  </g>
</svg>
