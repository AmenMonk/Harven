<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings Panel Test</title>
<style>
:root {
    --bg: #f0f0f5;
    --text: #1a1a2e;
    --text-secondary: #888;
    --border: #e0e0e8;
    --radius-lg: 12px;
    --accent: #6366f1;
    --bg-secondary: #f8f8fc;
}
[data-theme="dark"] {
    --bg: #1a1a2e;
    --text: #e0e0f0;
    --text-secondary: #999;
    --border: #2d2d4e;
    --bg-secondary: #222240;
}
body { font-family: system-ui; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }

/* ===== MODAL ===== */
.modal-overlay {
    display: flex; position: fixed; inset: 0;
    background: rgba(0,0,0,0.5); z-index: 2000;
    align-items: center; justify-content: center;
}
.modal {
    background: var(--bg);
    border-radius: var(--radius-lg);
    width: 1000px; max-width: 96vw; max-height: 95vh;
    display: flex; flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
}
.modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; border-bottom: 1px solid var(--border);
}
.modal-header h2 { font-size: 16px; margin: 0; }
.modal-body { padding: 20px; overflow-y: auto; flex: 1; }
.modal-footer {
    padding: 12px 20px; border-top: 1px solid var(--border);
    display: flex; justify-content: flex-end; gap: 8px;
}

/* ===== TABS ===== */
.settings-tabs {
    display: flex; flex-wrap: nowrap; gap: 4px;
    padding: 10px 14px; border-bottom: 1px solid var(--border);
    background: var(--bg-secondary); overflow-x: auto;
}
.stb {
    padding: 8px 14px; border: 1px solid transparent; border-radius: 8px;
    background: none; cursor: pointer; font-size: 13px; white-space: nowrap;
    color: var(--text-secondary);
}
.stb.active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* ===== TAB PANELS ===== */
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ===== SETTINGS CONTENT ===== */
.settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.setting-group { margin-bottom: 16px; }
.setting-group label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }
.setting-group input, .setting-group select {
    width: 100%; padding: 8px 12px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 14px;
    background: var(--bg); color: var(--text); box-sizing: border-box;
}
.setting-desc { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }
.btn-primary { background: var(--accent); color: #fff; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; }
.btn-secondary { background: var(--bg-secondary); color: var(--text); border: 1px solid var(--border); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; }
.theme-options { display: flex; gap: 8px; }
.theme-btn { padding: 6px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-secondary); cursor: pointer; font-size: 13px; color: var(--text); }
.theme-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.setting-toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.tags-list { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }

#test-indicator {
    position: fixed; top: 10px; left: 10px; z-index: 99999;
    background: #22c55e; color: #fff; padding: 4px 10px; border-radius: 4px;
    font-size: 12px; font-weight: bold;
}
</style>
</head>
<body data-theme="dark">
<div id="test-indicator">🧪 独立测试页 — 设置面板</div>

<!-- IDENTICAL STRUCTURE to Harven -->
<div class="modal-overlay" style="display:flex;" id="settingsModal">
    <div class="modal">
        <div class="modal-header">
            <h2>⚙️ 设置</h2>
            <span style="font-size:12px;color:var(--text-secondary);">测试页</span>
        </div>
        <div class="settings-tabs" id="settingsTabs">
            <button class="stb active" onclick="switchTab('basic',this)">📋 基本设置</button>
            <button class="stb" onclick="switchTab('profile',this)">👤 个人画像</button>
            <button class="stb" onclick="switchTab('appearance',this)">🎨 外观定制</button>
            <button class="stb" onclick="switchTab('security',this)">🔒 安全隐私</button>
            <button class="stb" onclick="switchTab('about',this)">ℹ️ 关于</button>
        </div>
        <div class="modal-body">
            <!-- basic -->
            <div class="tab-panel active" id="tab-basic">
                <div class="settings-grid">
                    <div class="setting-group">
                        <label>你的昵称</label>
                        <input type="text" value="测试用户" placeholder="输入昵称">
                    </div>
                    <div class="setting-group">
                        <label>AI 名称</label>
                        <input type="text" value="Harven AI" placeholder="AI名称">
                    </div>
                    <div class="setting-group">
                        <label>语言</label>
                        <select><option>简体中文</option><option>English</option></select>
                    </div>
                    <div class="setting-group">
                        <label>测试字段</label>
                        <input type="text" value="基本设置测试 —— 这个面板应该可见">
                    </div>
                </div>
            </div>

            <!-- profile -->
            <div class="tab-panel" id="tab-profile">
                <div class="settings-grid">
                    <div class="setting-group">
                        <label>兴趣标签</label>
                        <input type="text" placeholder="输入兴趣，回车添加" value="编程, AI, 自驾">
                        <div class="setting-desc">AI会根据你的兴趣优化回答方向</div>
                    </div>
                    <div class="setting-group">
                        <label>职业背景</label>
                        <input type="text" placeholder="你的职业或专业领域" value="软件工程师">
                        <div class="setting-desc">帮助AI理解你的专业视角</div>
                    </div>
                    <div class="setting-group">
                        <label>回答偏好</label>
                        <select>
                            <option>简洁 — 回答精炼、直奔主题</option>
                            <option selected>详细 — 充分解释、附带示例</option>
                            <option>专业 — 技术术语、深度分析</option>
                        </select>
                    </div>
                    <div class="setting-group">
                        <label>测试标记</label>
                        <input type="text" value="🟢 个人画像面板测试 —— 这个面板应该可见！">
                    </div>
                </div>
            </div>

            <!-- appearance -->
            <div class="tab-panel" id="tab-appearance">
                <div class="settings-grid" style="grid-template-columns:1fr;">
                    <div class="setting-group">
                        <label>主题</label>
                        <div class="theme-options">
                            <button class="theme-btn active">🌙 深色</button>
                            <button class="theme-btn">☀️ 浅色</button>
                        </div>
                    </div>
                    <div class="setting-group">
                        <label>字体大小</label>
                        <select>
                            <option>小号字体</option>
                            <option selected>中号字体</option>
                            <option>大号字体</option>
                        </select>
                    </div>
                    <div class="setting-group">
                        <label>测试标记</label>
                        <input type="text" value="🟢 外观定制面板测试 —— 这个面板应该可见！" style="font-weight:bold;color:#22c55e;">
                    </div>
                </div>
            </div>

            <!-- security -->
            <div class="tab-panel" id="tab-security">
                <div class="settings-grid">
                    <div class="setting-group">
                        <label>隐私库密码</label>
                        <input type="password" placeholder="设置隐私数据库密码">
                    </div>
                    <div class="setting-group">
                        <label>自动锁定</label>
                        <select>
                            <option selected>不自动锁定</option>
                            <option>5分钟</option>
                            <option>15分钟</option>
                        </select>
                    </div>
                    <div class="setting-group">
                        <label>测试标记</label>
                        <input type="text" value="🟢 安全隐私面板测试 —— 这个面板应该可见！">
                    </div>
                </div>
            </div>

            <!-- about -->
            <div class="tab-panel" id="tab-about">
                <div class="settings-grid">
                    <div class="setting-group">
                        <label>版本</label>
                        <input type="text" value="Harven AI v2.0.0" readonly>
                    </div>
                    <div class="setting-group">
                        <label>测试标记</label>
                        <input type="text" value="🟢 关于面板测试 —— 这个面板应该可见！" style="font-weight:bold;color:#22c55e;">
                    </div>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-secondary">恢复默认</button>
            <button class="btn-primary">💾 保存设置</button>
        </div>
    </div>
</div>

<script>
// DEAD SIMPLE tab switcher — 没有任何依赖
function switchTab(tab, btn) {
    console.log('[TEST] switch →', tab);
    // ① 隐藏所有面板
    var panels = document.querySelectorAll('.tab-panel');
    for (var i = 0; i < panels.length; i++) {
        panels[i].classList.remove('active');
    }
    // ② 高亮按钮
    var btns = document.querySelectorAll('.stb');
    for (i = 0; i < btns.length; i++) btns[i].classList.remove('active');
    if (btn) btn.classList.add('active');
    // ③ 显示目标面板
    var target = document.getElementById('tab-' + tab);
    if (target) {
        target.classList.add('active');
        target.style.border = '3px solid #22c55e';
        target.style.background = 'rgba(34,197,94,0.05)';
        console.log('[TEST] ✅ tab-' + tab, 'computed:',
            window.getComputedStyle(target).display,
            'rect:', target.getBoundingClientRect().height + 'px');
    } else {
        console.error('[TEST] ❌ 面板 tab-' + tab + ' 不存在!');
    }
}

// 初始验证
console.log('[TEST] 页面加载完成');
console.log('[TEST] 面板数量:', document.querySelectorAll('.tab-panel').length);
console.log('[TEST] basic computed:', window.getComputedStyle(document.getElementById('tab-basic')).display);
</script>
</body>
</html>
