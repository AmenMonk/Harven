# Harven AI — Docker 一键部署
# Windows / macOS / Linux 通用: docker compose up -d --build
services:
  harven:
    build: .
    container_name: harven-ai
    ports:
      - "7000:7000"
    volumes:
      # 数据持久化（账本/面板/知识库/相册全在这，容器重建不丢）
      - ./data:/app/data
      # 自定义配置：先复制 config.example.yaml 为 config.yaml 再取消下行注释
      # - ./config.yaml:/app/config.yaml
    restart: unless-stopped
